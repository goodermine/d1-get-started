name: Deploy Rustwood Studio

# Builds the static site and uploads it to the StartCP host over FTP.
# Triggers on any push that touches the site, plus a manual "Run workflow" button.
on:
  push:
    branches:
      - main
      - claude/new-server-website-build-oxgwlt
    paths:
      - "rustwoodstudio/**"
      - ".github/workflows/deploy-rustwood.yml"
  workflow_dispatch:

# Avoid overlapping deploys clobbering each other.
concurrency:
  group: deploy-rustwood
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rustwoodstudio
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rustwoodstudio/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Deploy to host over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Plain FTP by default (StartCP). Set the FTP_PROTOCOL secret to
          # "ftps" if your host supports it — it encrypts the connection.
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftp' }}
          port: ${{ secrets.FTP_PORT || '21' }}
          # Trailing slashes are required by the action.
          local-dir: ./dist/
          # The host's web root for rustwoodstudio.au, e.g. ./public_html/ —
          # set this in the FTP_SERVER_DIR secret.
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          # Keeps a manifest on the server so only changed files upload.
          # Don't wipe files we didn't create.
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
