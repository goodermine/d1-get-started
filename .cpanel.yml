---
# cPanel / StartCP "Git Version Control" deployment.
#
# This runs when you click "Deploy HEAD Commit" in the Git Version Control
# UI (after pulling the latest commit). It copies ONLY the website files into
# your live document root — the rest of the repo (source, config, .git) stays
# in the private repository path and is never served.
#
# ── BEFORE FIRST DEPLOY ──
# 1. Replace the DOCROOT value below with your real document root for
#    aaronellis.au (find it under "Manage Domains" → Document Root).
#    It will look something like /home/sites/42a/f/fbedbfeca1/public_html
# 2. After the first deploy, set up Directory Privacy on the /members/
#    folder (per-member logins). The copy steps below do NOT touch an
#    existing .htaccess / .htpasswd in /members/, so your password
#    protection survives every future deploy.

deployment:
  tasks:
    # ↓↓↓ SET THIS to your real document root (no trailing slash) ↓↓↓
    - export DOCROOT=/home/REPLACE_ME/public_html

    # --- Members area (the portal + EPUB library/reader) ---
    - /bin/mkdir -p "$DOCROOT/members/epub-reader"
    - /bin/cp -f  sdhportal.html        "$DOCROOT/members/index.html"
    - /bin/cp -Rf epub-reader/vendor    "$DOCROOT/members/epub-reader/"
    - /bin/cp -Rf epub-reader/books     "$DOCROOT/members/epub-reader/"
    - /bin/cp -f  epub-reader/index.html  "$DOCROOT/members/epub-reader/index.html"
    - /bin/cp -f  epub-reader/reader.html "$DOCROOT/members/epub-reader/reader.html"

    # --- Public marketing pages (optional — uncomment to also deploy) ---
    # - /bin/cp -f  sdh/index.html       "$DOCROOT/training.html"
    # - /bin/cp -f  magnetic/index.html  "$DOCROOT/magnetic.html"
